schema_version: 1
name: throughput
topology:
  tp: 1
  dp: 8
  ep: 8
  expert_parallel: true
replicas:
  - gpu_ids: "0,1,2,3,4,5,6,7"
    port: 8000
scheduler:
  max_model_len: 1048576
  max_num_seqs: 128
  max_num_batched_tokens: 8192
  cuda_graph_max_bs: 128
  chunked_prefill_size: 8192
  max_prefill_tokens: 8192
features:
  dspark: false
  prefix_caching: true
  bounded_replay: false
  engram_host: true
  mm_processor_cache_gb: 8
  hicache: false
notes: "Single DEP8 replica uses expert parallelism and larger batches for throughput."
