[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-autoresearch"
version = "0.1.0"
description = "Bounded Qwen serving configuration experiments with frozen AIPerf inputs"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]
optimizer = ["optuna>=4,<5"]

[project.scripts]
iar = "inference_autoresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
