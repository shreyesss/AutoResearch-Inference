schema_version: 1
name: b200-latency-campaign
description: "Latency, SLO-goodput, and cost qualification for DeepSeek V4.1 Flash on one 8xB200 node."
hardware: b200
engine: vllm
model: deepseek-v4.1-flash
gpu_count: 8
gpu_price_per_hour: 4.5
vllm_router:
  repository: https://github.com/vllm-project/router.git
  commit: 37b37a43c577cd7d83bad7b10b8b4650325b4fc7
  policy: consistent_hash
  aggregated_tp4_frontend:
    implementation: lib/router.py
    sticky_load_factor: 1.1
    connection_limit: 4096
    retry_connection_errors: 1
results_subdirectory: b200/vllm/latency-campaign
archive_root: /data/b200-bench-results/deepseek-v4.1-flash/i-01040ad89b81a570e
stream_gap_semantics: "SSE chunk gap; DSpark can emit multiple tokens in one chunk."

active_protocol:
  evidence_class: topology_selection
  workloads: [chat, code, agent, mix]
  cache_tiers: [25, 50, 75]
  cache_distribution: "Zipf(1.2), pool size 64, deterministic prefix affinity"
  warmup:
    duration_s: 120
    max_tokens: 1
    measured: false
  floor:
    mode: closed
    concurrency: 1
    duration_s: 180
  knee:
    mode: open
    duration_s: 300
    gate_tier: balanced
    maximum_adjustments: 2
    decrease_factor: 0.75
    increase_factor: 1.25
    comfortable_fraction_of_p95_limit: 0.75
  calibration:
    cache_tier: 50
    rates_per_workload: 3
    duration_s: 120
  discovery_repetitions: 1
  confirmation_repetitions: 2
  decision_total_repetitions: 3
  deferred_final_sla_repetitions: 5
  pareto_dimensions: [ttft_p99_ms, tpot_p99_ms, slo_goodput_rps]
  cache_match_tolerance: 0.10
  cache_mismatch_policy: "report actual; exclude mismatched points from direct Pareto comparison; no automatic retry"

dep8_vs_2xdep4:
  evidence_class: paired_closed_loop_topology_comparison
  runner: run_dep8_vs_2xdep4.sh
  workload:
    file: testing/workloads/latency-active-matrix.yaml
    case: agent-f75
    input_tokens: 8192
    output_tokens: 1024
    target_cacheable_fraction: 0.75
    prefix_distribution: "Zipf(1.2), pool size 64, prefix-key affinity"
  protocol:
    concurrencies: [256, 384, 512]
    client_shards: 8
    warmup_s: 120
    measured_s: 150
    discovery_repetitions: 1
    confirmation_repetitions: 2
    dataset_seed_namespace: dep8-vs-2xdep4-v1
    exact_dataset_pairing: true
  arms:
    dep8:
      experiment_id: LAT-CMP-DEP8-R7
      profile: latency-dep8-sla
      experiment_flags: []
    dep4_api2:
      experiment_id: LAT-CMP-2XDEP4-API2-S64
      profile: latency-2xdep4-sla
      experiment_flags: []
    dep4_api4:
      experiment_id: LAT-CMP-2XDEP4-API4-S64
      profile: latency-2xdep4-sla
      experiment_flags: [lat-api-4]
    dep4_seq80:
      experiment_id_api2: LAT-CMP-2XDEP4-API2-S80
      experiment_id_api4: LAT-CMP-2XDEP4-API4-S80
      profile: latency-2xdep4-sla
      experiment_flags_api2: [lat-seqs-80]
      experiment_flags_api4: [lat-api-4, lat-seqs-80]
  corrections:
    maximum: 2
    first:
      variable: api_server_count_per_replica
      baseline: 2
      candidate: 4
    second:
      variable: max_num_seqs_per_rank
      baseline: 64
      candidate: 80
      apply_to: first_correction_winner
    excluded: [eplb, stream_interval, larger_batch_sizes, router_policy]
  selection:
    minimum_completion_ratio: 0.999
    maximum_error_rate: 0.001
    ttft_p50_ms: 500
    ttft_p99_ms: 4000
    minimum_median_output_tokens_per_second_per_user: 30
    target_cache_hit_share: 0.75
    cache_hit_tolerance: 0.10
    primary: request_rps
    tie_breakers: [tpot_p50_ms, e2e_p50_ms]
  confirmation:
    total_required_observations: 3
    reuse_discovery_observation: true
    additional_repetitions: 2
    arms: [dep8, selected_2xdep4]
  report:
    same_concurrency_deltas: true
    best_qualifying_operating_point: true
    figures: [throughput_vs_ttft_p99, throughput_vs_tpot_p50]
    metrics:
      - request_rps
      - output_tokens_per_s
      - ttft_p50_p95_p99
      - tpot_p50_p95_p99
      - e2e_p50_p95_p99
      - completion_ratio
      - error_rate
      - cache_hit_share
      - backend_request_balance
  limits:
    conclusion: "Valid only for agent-f75 and the measured cache regime."
    router_tuning: false
    fault_testing: false
    update_measured_recommendation_automatically: false

measured_recommendation:
  as_of: "2026-10-15"
  evidence_status: provisional_single_run_closed_loop
  objective: "Best measured agent-f75 point satisfying TTFT p50 <= 0.5 s, TTFT p99 <= 4 s, and median generation speed >= 30 output tok/s/user."
  deployment_profile: latency-dep8-sla
  source_profile: latency-dep8
  source_experiment_flags: [lat-prefix-on, lat-dspark-k5, lat-seqs-64, lat-graph-512, lat-batched-16k, lat-api-4]
  workload:
    case: agent-f75
    input_tokens: 8192
    output_tokens: 1024
    target_cacheable_fraction: 0.75
  settings:
    topology: "TP1 x DP8 x EP8 on one 8xB200 node"
    max_num_seqs_per_rank: 64
    max_num_seqs_node_wide: 512
    cuda_graph_capture_size: 512
    max_num_batched_tokens: 16384
    dspark_speculative_tokens: 5
    dspark_adaptive_verification: false
    api_server_count: 4
    prefix_caching: true
    eplb: false
  admission:
    recommended_closed_loop_concurrency: 384
    measured_custom_objective_ceiling_concurrency: 512
    explanation: "Client concurrency is load, not a server scheduler setting. c384 passes the balanced tier and retains nearly all c512 throughput with materially better TPOT and E2E latency; c512 passes only the separate p50/p99/speed objective."
  measured_points:
    c384:
      request_rps: 25.4718
      output_tokens_per_s: 26083.2
      ttft_p50_ms: 233.4
      ttft_p99_ms: 2664.0
      tpot_p50_ms: 14.10
      e2e_p50_ms: 14787.5
      cache_hit_share: 0.7582
    c512:
      request_rps: 26.0860
      output_tokens_per_s: 26712.1
      ttft_p50_ms: 322.3
      ttft_p99_ms: 2884.0
      tpot_p50_ms: 18.51
      e2e_p50_ms: 19397.4
      cache_hit_share: 0.7728
  highest_measured_throughput_point:
    source: LAT-R10-DEP8-DSPARK2-S160-LP4K-B16K-G512
    closed_loop_concurrency: 1024
    request_rps: 43.5470
    output_tokens_per_s: 44592.1
    ttft_p99_ms: 6096.5
    slo_fit: false
    explanation: "This is the highest measured R10 point, not a demonstrated saturation ceiling or latency-optimal deployment: it misses the 4-second TTFT-p99 target."
  qualification_required:
    - "Repeat the selected point three times."
    - "Validate with open-loop arrivals and production ingress before quoting a customer SLA."
    - "Recalibrate when prompt length, output length, or achieved cache reuse changes."

slo_tiers:
  strict:
    description: "Provisional responsive-interactive engineering target; not a customer SLA."
    gate_overall_latency: false
    mixed_category_minimum_samples: advisory
    default:
      minimum_samples: 100
      minimum_completion_ratio: 0.999
      maximum_error_rate: 0.001
      maximum_queue_slope_ms_per_s: 1.0
      ttft_p95_ms: 1000
      ttft_p99_ms: 2000
      tpot_p95_ms: 20
      tpot_p99_ms: 40
      stream_gap_p99_ms: 250
      request_limits:
        ttft_ms: 2000
        tpot_ms: 40
        maximum_stream_gap_ms: 250
    class_overrides:
      chat:
        e2e_p95_ms: 15000
      code-reasoning:
        e2e_p95_ms: 30000
      agentic:
        e2e_p95_ms: 30000
      long-doc:
        ttft_p95_ms: 3000
        ttft_p99_ms: 6000
        e2e_p95_ms: 30000
        request_limits:
          ttft_ms: 6000
          tpot_ms: 40
          maximum_stream_gap_ms: 250
      multimodal:
        ttft_p95_ms: 3000
        ttft_p99_ms: 6000
        e2e_p95_ms: 20000
        request_limits:
          ttft_ms: 6000
          tpot_ms: 40
          maximum_stream_gap_ms: 250
      long-context:
        minimum_samples: 20
        ttft_p95_ms: 30000
        ttft_p99_ms: 60000
        tpot_p95_ms: 100
        tpot_p99_ms: 200
        request_limits:
          ttft_ms: 60000
          tpot_ms: 200

  balanced:
    description: "Existing campaign gate extended with p99 and per-class reporting."
    gate_overall_latency: false
    default:
      minimum_samples: 100
      minimum_completion_ratio: 0.995
      maximum_error_rate: 0.001
      maximum_queue_slope_ms_per_s: 1.0
      ttft_p95_ms: 2000
      ttft_p99_ms: 5000
      tpot_p95_ms: 50
      tpot_p99_ms: 100
      stream_gap_p99_ms: 500
      request_limits:
        ttft_ms: 5000
        tpot_ms: 100
        maximum_stream_gap_ms: 500
    class_overrides:
      chat:
        e2e_p95_ms: 30000
      code-reasoning:
        e2e_p95_ms: 75000
      agentic:
        e2e_p95_ms: 75000
      long-doc:
        ttft_p95_ms: 5000
        ttft_p99_ms: 15000
        e2e_p95_ms: 60000
        request_limits:
          ttft_ms: 15000
          tpot_ms: 100
          maximum_stream_gap_ms: 500
      multimodal:
        ttft_p95_ms: 5000
        ttft_p99_ms: 15000
        e2e_p95_ms: 45000
        request_limits:
          ttft_ms: 15000
          tpot_ms: 100
          maximum_stream_gap_ms: 500
      long-context:
        minimum_samples: 20
        ttft_p95_ms: 60000
        ttft_p99_ms: 120000
        tpot_p95_ms: 200
        tpot_p99_ms: 400
        request_limits:
          ttft_ms: 120000
          tpot_ms: 400

  relaxed:
    description: "Latency-bounded background or long-running service tier."
    gate_overall_latency: false
    default:
      minimum_samples: 50
      minimum_completion_ratio: 0.995
      maximum_error_rate: 0.005
      maximum_queue_slope_ms_per_s: 1.0
      ttft_p95_ms: 5000
      ttft_p99_ms: 15000
      tpot_p95_ms: 100
      tpot_p99_ms: 200
      stream_gap_p99_ms: 1000
      request_limits:
        ttft_ms: 15000
        tpot_ms: 200
        maximum_stream_gap_ms: 1000
    class_overrides:
      long-doc:
        ttft_p95_ms: 15000
        ttft_p99_ms: 30000
        request_limits:
          ttft_ms: 30000
          tpot_ms: 200
          maximum_stream_gap_ms: 1000
      multimodal:
        ttft_p95_ms: 10000
        ttft_p99_ms: 30000
        request_limits:
          ttft_ms: 30000
          tpot_ms: 200
          maximum_stream_gap_ms: 1000
      long-context:
        minimum_samples: 10
        ttft_p95_ms: 120000
        ttft_p99_ms: 300000
        tpot_p95_ms: 500
        tpot_p99_ms: 1000
        request_limits:
          ttft_ms: 300000
          tpot_ms: 1000

