experiments:
  - id: LAT-00
    title: "Import immutable existing evidence"
    status: reusable
    kind: evidence
    runner: run_import_evidence.sh
    change: "No serving change; rebuild the latency report from archived evidence."
    expected: "EXP-01/02 and DEP8/offline history remain reference-only and never enter the new decision frontier."
    interpretation:
      - "Missing or invalid archive artifacts are reported, not silently promoted."

  - id: LAT-PD-SMOKE
    title: "Mandatory stock same-node PD NIXL smoke"
    status: planned
    kind: smoke
    runner: run_pd_smoke.sh
    profile: pd-tp4-baseline
    change: "Split one node into TP4 prefill on GPUs 0-3 and TP4 decode on GPUs 4-7 behind native vllm-router."
    expected: "Successful text/reasoning/tool responses with NixlConnector active in both workers and no KV-load fallback."
    stop_condition: "If stock fails, allow one prebuilt pinned-PR fallback smoke; if that fails, mark PD unavailable and run TP4 only."
    interpretation:
      - "A successful response with kv_load_failure_policy=fail proves the request did not silently recompute on decode."

  - id: LAT-TP4-BALANCED
    title: "2xTP4 existing balanced configuration"
    status: planned
    kind: configuration
    runner: run_tp4_balanced.sh
    server_kind: aggregated
    profile: balanced
    experiment_flags: []
    calibrate: true
    include_uncached: true
    calibration_rates:
      chat: [4, 8, 12]
      code: [1, 2, 4]
      agent: [0.5, 1, 2]
      mix: [2, 4, 8]
    change: "Existing target-only TP4 baseline: seq64, batch4K, graph64, prefix cache enabled."
    expected: "Higher sustainable rate than strict TP4, with TPOT rising as decode batches grow."
    interpretation:
      - "TTFT or queue growth with TPOT still below limits means admission/frontend pressure."
      - "TPOT p99 near the limit with flat queues means decode batching is the constraint."

  - id: LAT-TP4-LOW
    title: "2xTP4 existing low-latency configuration"
    status: planned
    kind: configuration
    runner: run_tp4_low_latency.sh
    server_kind: aggregated
    profile: low-latency
    experiment_flags: []
    calibrate: false
    calibration_source: LAT-TP4-BALANCED
    include_uncached: false
    change: "Use existing DSpark-k5/adaptive, seq8, batch4K profile."
    expected: "Lowest TPOT at low load but earlier TTFT queueing from the seq8 cap."
    interpretation:
      - "Low TPOT plus high TTFT/waiting confirms the active-sequence cap is too restrictive for that rate."
      - "Poor DSpark acceptance means the draft path is not paying for its memory/verification cost."

  - id: LAT-TP4-HYBRID
    title: "2xTP4 DSpark-k2 seq32 hybrid"
    status: planned
    kind: configuration
    runner: run_tp4_hybrid.sh
    server_kind: aggregated
    profile: latency-tp4
    experiment_flags: [lat-prefix-on, lat-dspark-k2, lat-seqs-32]
    calibrate: false
    calibration_source: LAT-TP4-BALANCED
    include_uncached: false
    change: "From the uncached target-only latency control, enable prefix cache, DSpark k2 without adaptive verification, and seq32."
    expected: "Recover much of balanced TP4 capacity while retaining a material decode-latency benefit."
    interpretation:
      - "If it is dominated by both existing profiles, no intermediate TP4 profile is justified."
      - "If it occupies the TTFT/TPOT Pareto middle, carry it into manual confirmation."

  - id: LAT-PD-BASELINE
    title: "Stock PD recipe baseline"
    status: planned
    kind: configuration
    runner: run_pd_baseline.sh
    server_kind: pd
    profile: pd-tp4-baseline
    experiment_flags: []
    calibrate: true
    include_uncached: true
    calibration_rates:
      chat: [4, 8, 12]
      code: [1, 2, 4]
      agent: [0.5, 1, 2]
      mix: [2, 4, 8]
    change: "Stock 1P1D: P/D seq32, batch8K, native vllm-router and NIXL."
    expected: "Prefill/decode isolation should reduce decode stalls on agent/mixed traffic, offset by KV handoff latency."
    interpretation:
      - "High TTFT with low P/D queues points to handoff/router overhead."
      - "Busy prefill and idle decode means the fixed 4/4 split is prefill-bound; the reverse means decode-bound."

  - id: LAT-PD-PREFILL16K
    title: "PD prefill batch16K"
    status: planned
    kind: configuration
    runner: run_pd_prefill16k.sh
    server_kind: pd
    profile: pd-tp4-prefill16k
    experiment_flags: []
    calibrate: false
    calibration_source: LAT-PD-BASELINE
    include_uncached: false
    change: "Only prefill max_num_batched_tokens changes from 8K to 16K."
    expected: "Higher prefill efficiency and possibly lower long-prompt TTFT without directly changing decode batches."
    interpretation:
      - "Lower TTFT with unchanged TPOT confirms a prefill-side gain."
      - "No gain or worse handoff tails means the larger prefill batch is not useful for this traffic."

  - id: LAT-PD-DECODE64
    title: "PD decode seq64"
    status: planned
    kind: configuration
    runner: run_pd_decode64.sh
    server_kind: pd
    profile: pd-tp4-decode64
    experiment_flags: []
    calibrate: false
    calibration_source: LAT-PD-BASELINE
    include_uncached: false
    change: "Only decode max_num_seqs changes from 32 to 64."
    expected: "Higher decode capacity at the cost of potentially higher TPOT tails."
    interpretation:
      - "Higher goodput with passing TPOT is a win; TPOT p99 inflation without queue relief is a loss."

deferred_experiments:
  - id: LAT-01
    title: "Ingress and warmup qualification"
    status: planned
    runner: run_lat_01.sh
    objective: "Separate backend service time from router/ingress and warmup overhead."
    workloads: [chat-512-256, agent-8k-1k]
    arms: [direct-replica, local-router, optional-remote-ingress]
    comments: "Use the same requests and low load. Record first-run JIT/graph warmup separately from steady state."
    interpretation:
      - "A large routed-minus-direct delta identifies frontend work, not a GPU-model problem."
      - "Only steady-state values feed later frontiers."

  - id: LAT-02
    title: "No-queue workload latency floors"
    status: planned
    runner: run_lat_02.sh
    objective: "Measure the lowest attainable latency for each workload class."
    workloads: [chat-512-256, code-2k-1k, agent-8k-1k, document-32k-512, multimodal-512-256, long-context-128k-128, long-context-512k-32, long-context-1m-16]
    arms: [latency-tp4, latency-dep8]
    load: "closed-loop c=1,2,4,8; long-context stops at safe lower points"
    comments: "If c=1 misses a tier, admission control cannot make that topology satisfy the tier."
    interpretation:
      - "Prefill-heavy failures appear in TTFT."
      - "Decode-heavy failures appear in TPOT and E2E."

  - id: LAT-03
    title: "Matched DSpark A/B"
    status: planned
    runner: run_lat_03.sh
    objective: "Measure whether DSpark improves latency without memory, quality, or stability regressions."
    workloads: [chat-512-256, code-2k-1k, agent-8k-1k]
    arms: [target-only, lat-dspark-k2, lat-dspark-k5]
    load: "closed-loop c=1,16,32,64 plus matched open-loop points"
    comments: "All non-DSpark settings and cache state remain identical. Adaptive verification is disabled in these B200 controls."
    interpretation:
      - "Keep DSpark only when TPOT/E2E and SLO-goodput improve with valid outputs and zero instability."
      - "Acceptance near one means proposal overhead is not paying for itself."

  - id: LAT-04
    title: "Active-sequence and graph-cap knee"
    status: planned
    runner: run_lat_04.sh
    objective: "Balance engine waiting/TTFT against larger-batch TPOT."
    workloads: [production-mix-32k]
    arms: [lat-seqs-8, lat-seqs-16, lat-seqs-32, lat-seqs-64]
    comments: "CUDA graph coverage remains at 64 for every arm, so sequence cap is the intended variable."
    interpretation:
      - "Rising engine waiting with low TPOT means the cap is too small."
      - "Low waiting with failing TPOT means the cap is too large."

  - id: LAT-05
    title: "Prefill/decode interference"
    status: planned
    runner: run_lat_05.sh
    objective: "Find the token budget that protects active streams while admitting 8K/32K prompts."
    workloads: [chat-512-256, agent-8k-1k, document-32k-512, production-mix-32k]
    arms: [lat-batched-2k, lat-batched-4k, lat-batched-8k, lat-long-prefill-4k]
    comments: "Evaluate short-request stream-gap tails and long-request TTFT together."
    interpretation:
      - "If no budget satisfies both classes, route long documents to a separate pool."

  - id: LAT-06
    title: "TP4 versus DEP8"
    status: planned
    runner: run_lat_06.sh
    objective: "Choose topology using SLO-goodput rather than raw throughput."
    workloads: [chat-512-256, agent-8k-1k, production-mix-32k]
    arms: [best-latency-tp4, latency-dep8]
    comments: "This is a whole-system comparison because TP4 and DEP8 use different attention/MoE stacks."
    interpretation:
      - "TP4 is favored by strict per-stream TPOT; DEP8 is favored when it meets the tier at higher RPS."

  - id: LAT-07
    title: "Prefix cache and rank affinity"
    status: planned
    runner: run_lat_07.sh
    objective: "Measure cold-miss, expected-cache, sticky, and unpinned behavior."
    workloads: [production-mix-32k, agent-sessions]
    arms: [lat-prefix-off, lat-prefix-on-unpinned, lat-prefix-on-sticky]
    comments: "Report hit and miss latency separately where telemetry permits; do not infer production gains from configured reuse alone."
    interpretation:
      - "Low achieved reuse with high theoretical reuse indicates routing/cache placement loss."

