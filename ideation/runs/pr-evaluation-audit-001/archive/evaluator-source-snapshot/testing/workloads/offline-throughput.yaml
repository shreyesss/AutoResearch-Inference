{
  "schema_version": 1,
  "name": "offline-throughput",
  "description": "Fixed-output, thinking-off shapes for closed-loop maximum output-token throughput. These are non-SLO offline measurements.",
  "minimum_requests": 256,
  "defaults": {
    "category": "chat",
    "temperature": 0,
    "thinking": false,
    "reasoning_effort": "low",
    "prefix_mode": "none",
    "prefix_tokens": 0,
    "reuse_percent": 0,
    "image_share": 0,
    "ignore_eos": true
  },
  "cases": [
    {
      "name": "offline-decode-128-128",
      "shape": "decode",
      "isl": 128,
      "max_tokens": 128,
      "min_tokens": 128
    },
    {
      "name": "offline-decode-128-512",
      "shape": "decode",
      "isl": 128,
      "max_tokens": 512,
      "min_tokens": 512
    },
    {
      "name": "offline-decode-128-2k",
      "shape": "decode",
      "isl": 128,
      "max_tokens": 2048,
      "min_tokens": 2048
    },
    {
      "name": "offline-mixed-512-256",
      "shape": "mixed",
      "isl": 512,
      "max_tokens": 256,
      "min_tokens": 256
    },
    {
      "name": "offline-mixed-2k-1k",
      "shape": "mixed",
      "isl": 2048,
      "max_tokens": 1024,
      "min_tokens": 1024
    },
    {
      "name": "offline-mixed-8k-512",
      "shape": "mixed",
      "isl": 8192,
      "max_tokens": 512,
      "min_tokens": 512
    },
    {
      "name": "offline-mixed-32k-256",
      "shape": "mixed",
      "isl": 32768,
      "max_tokens": 256,
      "min_tokens": 256
    }
  ]
}
