schema_version: 1
name: latency-2xdep4-sla
topology:
  tp: 1
  dp: 4
  ep: 4
  expert_parallel: true
replicas:
  - gpu_ids: "0,1,2,3"
    port: 8100
    extra_args: [--data-parallel-rpc-port, "29510"]
  - gpu_ids: "4,5,6,7"
    port: 8101
    extra_args: [--data-parallel-rpc-port, "29610"]
scheduler:
  max_model_len: 1048576
  max_num_seqs: 64
  max_num_batched_tokens: 16384
  cuda_graph_max_bs: 512
  chunked_prefill_size: 16384
  max_prefill_tokens: 16384
features:
  dspark: true
  dspark_num_speculative_tokens: 5
  dspark_adaptive_verification: false
  prefix_caching: true
  bounded_replay: false
  engram_host: true
  mm_processor_cache_gb: 8
  hicache: false
extra_args:
  - --api-server-count
  - "2"
  - --enable-prompt-tokens-details
notes: "Latency-only 2xDEP4 comparison baseline: two independent TP1/DP4/EP4 engines with R7 scheduler and DSpark settings, API2 per replica, unique DP RPC ports, and the fixed latency router on public port 8000."
