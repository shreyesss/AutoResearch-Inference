schema_version: 1
name: long-context
topology:
  tp: 8
  dp: 1
  ep: 1
  expert_parallel: false
replicas:
  - gpu_ids: "0,1,2,3,4,5,6,7"
    port: 8000
scheduler:
  max_model_len: 1048576
  max_num_seqs: 16
  max_num_batched_tokens: 4096
  cuda_graph_max_bs: 32
  chunked_prefill_size: 4096
  max_prefill_tokens: 8192
features:
  dspark: false
  prefix_caching: true
  bounded_replay: false
  engram_host: true
  mm_processor_cache_gb: 8
  hicache: false
notes: "Single TP8 replica limits concurrency for stable long-context execution."
