[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-ideation"
version = "0.1.0"
description = "Inference source corpus and evidence-backed research"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
web-research = ["gpt-researcher==0.16.1; python_version >= '3.12'"]

[project.scripts]
ideate = "ideation.cli:main"

[tool.setuptools.packages.find]
include = ["ideation*"]
