    evidence_class: reused_cache_hot_slo
    include_in_slo_frontier: false
    include_as_legacy_reference: true
    profile: low-latency
    cache_regime: "approximately 98% hits"
    cache_hit_share: 0.982
    comments: "Passing boundary 4.345682 req/s; engine queue and max_num_seqs=8 bound TTFT. DSpark and sequence cap changed together."
  - id: EXP-02
    label: "2xTP4 balanced, target-only, cache-hot default mix"
    relative_path: results/b200/vllm/balanced/default-mix/20261010-175056
    evidence_class: reused_cache_hot_slo
    include_in_slo_frontier: false
    include_as_legacy_reference: true
    profile: balanced
    cache_regime: "approximately 98% hits"
