schema_version: 1
name: latency-dep8-sla
topology:
  tp: 1
  dp: 8
  ep: 8
  expert_parallel: true
replicas:
  - gpu_ids: "0,1,2,3,4,5,6,7"
    port: 8000
scheduler:
  max_model_len: 1048576
  max_num_seqs: 64
  max_num_batched_tokens: 16384
  cuda_graph_max_bs: 512
  chunked_prefill_size: 16384
  max_prefill_tokens: 16384
features:
  dspark: true
  dspark_num_speculative_tokens: 5
  dspark_adaptive_verification: false
  prefix_caching: true
  bounded_replay: false
  engram_host: true
  mm_processor_cache_gb: 8
  hicache: false
extra_args:
  - --api-server-count
  - "4"
  - --enable-prompt-tokens-details
notes: "R7 latency winner for agent-f75: DEP8/EP8, DSpark k5, seq64 per rank, graph512, batch16K, prefix cache, API4, no EPLB. Use closed-loop c384 as the measured balanced-tier operating point; c512 passes only the separate p50/p99/speed objective and is not a scheduler value."
